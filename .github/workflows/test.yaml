name: 'build-test'
on:
  pull_request_target:
  push:
    branches:
      - main
      - 'releases/*'
    paths:
      - src/**
      - __test__/**
      - package*
      - .github/workflows/test.yaml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 16.20.2
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Fetch ENV from .env.ci
        run: |-
          cat .env.ci >> $GITHUB_ENV
      - name: Run all NPM targets
        run: npm run all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          retention-days: 15
          name: new-dist
          path: dist

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download Artifacts
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
        with:
          name: new-dist
      - name: Set environment variables
        run: echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
      - name: Execute test run
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: Test PR
          pr_source: test/pr
          pr_body: ${{ env.DATE }}

  test-extended:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download Artifacts
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
        with:
          name: new-dist
      - name: Set environment variables
        run: echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
      - name: Execute test run with body links
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: Test staging to main
          pr_source: test/staging
          pr_target: test/main
          pr_body: "The following changes are going to be merged from staging to main (${{ env.DATE }}):"
          pr_body_with_links: true
